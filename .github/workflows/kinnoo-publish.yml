name: Kinnoo Publish Reference

on:
  workflow_dispatch:
    inputs:
      agent_dir:
        description: "Path to agent directory to validate and publish"
        required: true
        default: "./my-agent"
      strict_mode:
        description: "Enable strict trust controls when supported"
        required: false
        default: "0"
  push:
    tags:
      - "agent-*"

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      KINNOO_AGENT_DIR: ${{ inputs.agent_dir || './my-agent' }}
      KINNOO_CI_STRICT_MODE: ${{ inputs.strict_mode || '0' }}
      KINNOO_REGISTRY_URL: ${{ secrets.KINNOO_REGISTRY_URL }}
      KINNOO_REGISTRY_TOKEN: ${{ secrets.KINNOO_REGISTRY_TOKEN }}
      KINNOO_TENANT_SLUG: ${{ secrets.KINNOO_TENANT_SLUG }}
      KINNOO_ARCHIVE_ROOT: ${{ runner.temp }}/kinnoo-archive
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate required secrets and environment
        run: |
          set -euo pipefail
          [[ -n "${KINNOO_REGISTRY_URL}" ]] || { echo "Missing secret: KINNOO_REGISTRY_URL"; exit 1; }
          [[ -n "${KINNOO_REGISTRY_TOKEN}" ]] || { echo "Missing secret: KINNOO_REGISTRY_TOKEN"; exit 1; }
          [[ -n "${KINNOO_TENANT_SLUG}" ]] || { echo "Missing secret: KINNOO_TENANT_SLUG"; exit 1; }
          [[ -d "${KINNOO_AGENT_DIR}" ]] || { echo "Missing agent directory: ${KINNOO_AGENT_DIR}"; exit 1; }

      - name: Install kinnoo dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run compatibility preflight (check)
        run: |
          set -euo pipefail
          python3 src/kinnoo/cli.py check "${KINNOO_AGENT_DIR}"

      - name: Pack agent archive
        run: |
          set -euo pipefail
          python3 src/kinnoo/cli.py pack "${KINNOO_AGENT_DIR}"

      - name: Publish to remote registry
        run: |
          set -euo pipefail
          AGENT_NAME="$(python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml
          agent_dir = os.environ.get("KINNOO_AGENT_DIR", "").strip()
          manifest = yaml.safe_load((Path(agent_dir) / "kinnoo.yaml").read_text(encoding="utf-8"))
          print(str(manifest.get("name", "")).strip())
          PY
          )"
          [[ -n "${AGENT_NAME}" ]] || { echo "Unable to resolve agent name from kinnoo.yaml"; exit 1; }

          STRICT_FLAGS=""
          if [[ "${KINNOO_CI_STRICT_MODE}" == "1" ]]; then
            # Keep reference workflow forward-compatible with feature71 strict-mode controls.
            STRICT_FLAGS="--strict"
          fi

          python3 src/kinnoo/cli.py publish "${AGENT_NAME}" --remote ${STRICT_FLAGS}