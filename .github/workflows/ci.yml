name: CI

on:
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'web/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install kinnoo package (editable mode)
        run: pip install -e .

      - name: Install web dependencies
        run: npm ci
        working-directory: web
      
      - name: Run pytest suite
        run: python3 -m pytest tests

      - name: Run smoke tests from markdown
        run: |
          set -e
          for md in notes/features/*-smoke-tests.md; do
            echo "Running smoke tests in $md"
            script_file="$(mktemp)"
            awk '/^```bash/{flag=1;next}/^```/{flag=0}flag' "$md" > "$script_file"

            if [ -s "$script_file" ]; then
              timeout 15m bash -euo pipefail -c '
                REPO_ROOT="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
                cd "$REPO_ROOT"
                trap "jobs -pr | xargs -r kill 2>/dev/null || true" EXIT
                source "$1"
              ' _ "$script_file"
            fi

            rm -f "$script_file"
          done