name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kinnoo_registry
          POSTGRES_USER: kinnoo
          POSTGRES_PASSWORD: kinnoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kinnoo -d kinnoo_registry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REGISTRY_DATABASE_URL: postgresql+psycopg://kinnoo:kinnoo@127.0.0.1:5432/kinnoo_registry
      REGISTRY_METADATA_BACKEND: json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install kinnoo package (editable mode)
        run: pip install -e .

      - name: Run pytest suite (unit tests only)
        run: python3 -m pytest tests -m "not integration"

  frontend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'web/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

      - name: Run vitest suite
        run: npm test
        working-directory: web