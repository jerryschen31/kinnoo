[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kinnoo"
version = "0.1.0"
description = "Kinnoo agent CLI and scaffolding tools"
authors = [
    { name = "Kinnoo Team" }
]
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
kinnoo = "kinnoo.cli:main"
