services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: kinnoo-server:dev
    container_name: kinnoo-server-dev
    ports:
      - "8000:8000"
    environment:
      KINNOO_ENV: dev
      REGISTRY_STORAGE_BACKEND: local
      REGISTRY_LOCAL_STORAGE_ROOT: /data
      REGISTRY_TOKEN_SIGNING_SECRET: dev-token-signing-secret
      REGISTRY_SESSION_SIGNING_SECRET: dev-session-signing-secret
      REGISTRY_REGISTER_TOKEN_SECRET: dev-register-token-secret
      REGISTRY_PASSWORD_RESET_TOKEN_SECRET: dev-password-reset-token-secret
    volumes:
      - ./data:/data
    restart: unless-stopped
