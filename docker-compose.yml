services:
  postgres:
    image: postgres:16-alpine
    container_name: kinnoo-postgres-dev
    environment:
      POSTGRES_DB: kinnoo_registry
      POSTGRES_USER: kinnoo
      POSTGRES_PASSWORD: kinnoo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinnoo -d kinnoo_registry"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: kinnoo-server:dev
    container_name: kinnoo-server-dev
    ports:
      - "8000:8000"
    environment:
      KINNOO_ENV: dev
      REGISTRY_STORAGE_BACKEND: local
      REGISTRY_LOCAL_STORAGE_ROOT: /data
      REGISTRY_TOKEN_SIGNING_SECRET: ${REGISTRY_TOKEN_SIGNING_SECRET?set-in-shell-or-.env}
      REGISTRY_SESSION_SIGNING_SECRET: ${REGISTRY_SESSION_SIGNING_SECRET?set-in-shell-or-.env}
      REGISTRY_REGISTER_TOKEN_SECRET: ${REGISTRY_REGISTER_TOKEN_SECRET?set-in-shell-or-.env}
      REGISTRY_PASSWORD_RESET_TOKEN_SECRET: ${REGISTRY_PASSWORD_RESET_TOKEN_SECRET?set-in-shell-or-.env}
      REGISTRY_METADATA_BACKEND: ${REGISTRY_METADATA_BACKEND:-json}
      REGISTRY_DATABASE_URL: ${REGISTRY_DATABASE_URL:-postgresql+psycopg://kinnoo:kinnoo@postgres:5432/kinnoo_registry}
      REGISTRY_DB_POOL_SIZE: ${REGISTRY_DB_POOL_SIZE:-10}
      REGISTRY_DB_MAX_OVERFLOW: ${REGISTRY_DB_MAX_OVERFLOW:-20}
      REGISTRY_DB_POOL_RECYCLE_SECONDS: ${REGISTRY_DB_POOL_RECYCLE_SECONDS:-1800}
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
